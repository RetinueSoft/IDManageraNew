# ID Manager on the server: PostgreSQL 16 + the API + the web UI (nginx, which also forwards /api/ to the API).
# Public access: the server's common Caddy (VpsSetup caddy/sites/idcardmanager.caddy) serves http://<ip>:5144
# (UI) and :5165 (API) from 127.0.0.1:UI_HOST_PORT / API_HOST_PORT.
# Settings: /root/common/env/idcardmanager.env (linked as .env next to this file).
#
# The images are built by GitHub Actions from the release branch (.github/workflows/docker-image.yml).
# On the server, update.sh downloads this file and keeps everything up to date:
#   sudo /root/idcardmanager/update.sh
# Local build instead: docker compose build api ui
#
# This app has its own database (IDManager); the first start creates the schema and one Super Admin.
name: idcardmanager

services:
  postgres:
    image: postgres:16
    container_name: idcardmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: IDManager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - idmanager-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"   # only reachable from the server itself (SSH tunnel for pgAdmin/DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IDManager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/retinuesoft/idcardmanager-api:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: idcardmanager-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=IDManager;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      # How long a login lasts, in minutes, from the moment of login.
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-30}
      Cors__AllowedOrigins__0: "http://${IDCM_PUBLIC_HOST:-localhost}:5144"
      # The Super Admin created on the very first start (only when the database has no users).
      SeedAdmin__Phone: ${SEED_ADMIN_PHONE:-9943135008}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-Red@123}
      TZ: "${TZ:-UTC}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-15165}:8080"   # only the server's common Caddy reaches it
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: ghcr.io/retinuesoft/idcardmanager-ui:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: idcardmanager-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-15144}:8080"    # only the server's common Caddy reaches it
    depends_on:
      - api

volumes:
  idmanager-postgres-data:
