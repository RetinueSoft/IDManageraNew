server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Card PDFs, member PDFs and images are uploaded through /api/ (the API allows up to 30 MB).
    client_max_body_size 32m;

    # The API container, looked up when a request comes in (not when nginx starts), so the UI still
    # starts if the API is a moment behind.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rendering a card PDF can take a few seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The app shell and its scripts: always revalidated, so a new deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else is the single-page app: unknown paths go to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
