# Builds the ID Manager API and UI images and publishes them to GitHub Container Registry (GHCR):
#   ghcr.io/retinuesoft/idcardmanager-api:latest / :sha-<commit>
#   ghcr.io/retinuesoft/idcardmanager-ui:latest  / :sha-<commit>
# The server then updates with /root/idcardmanager/update.sh (deploy/update.sh).
name: Docker images

on:
  push:
    branches: [release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deploy/**'
      - '.env.example'
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  packages: write             # push to ghcr.io with the built-in GITHUB_TOKEN

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: api
            image: ghcr.io/retinuesoft/idcardmanager-api
            dockerfile: backend/Dockerfile
          - target: ui
            image: ghcr.io/retinuesoft/idcardmanager-ui
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ID Manager ${{ matrix.target }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
